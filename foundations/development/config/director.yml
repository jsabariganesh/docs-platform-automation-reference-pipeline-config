az-configuration:
- name: infra-az
  clusters:
  - cluster: tpk_vc01_cl01
    resource_pool: karthic-rp
- name: deploy-az
  clusters:
  - cluster: tpk_vc01_cl01
    resource_pool: karthic-rp
- name: service-az
  clusters:
  - cluster: tpk_vc01_cl01
    resource_pool: karthic-rp
iaas-configurations:
- additional_cloud_properties: {}
  bosh_disk_path: ((bosh_disk_path))
  bosh_template_folder: ((bosh_template_folder))
  bosh_vm_folder: ((bosh_vm_folder))
  datacenter: ((datacenter))
  disk_type: thin
  ephemeral_datastores_string: ((ephemeral_datastores_string))
  name: default
  nsx_t_auth_type: local_user
  nsx_address: ((nsx.url))
  nsx_ca_certificate: ((nsx.ca_cert))
  nsx_mode: ((nsx_mode))
  nsx_networking_enabled: ((nsx_networking_enabled))
  nsx_password: ((iaas.nsx_password))
  nsx_username: ((iaas.nsx_username))
  persistent_datastores_string: ((persistent_datastores_string))
  ssl_verification_enabled: ((ssl_verification_enabled))
  vcenter_host: ((vcenter_url))
  vcenter_password: ((vcenter_user.password))
  vcenter_username: ((vcenter_user.username))
network-assignment:
  network:
    name: infra-network
  other_availability_zones: []
  singleton_availability_zone:
    name: infra-az
networks-configuration:
  icmp_checks_enabled: true
  networks:
  - name: infra-network
    subnets:
    - iaas_identifier: kart-infra
      cidr: 192.168.80.0/24
      dns: 10.160.143.74,192.19.189.10,192.19.189.20,192.19.189.30
      gateway: 192.168.80.1
      reserved_ip_ranges: 192.168.80.1-192.168.80.10
      availability_zone_names:
      - infra-az
  - name: deploy-network
    subnets:
    - iaas_identifier: karti-deploy
      cidr: 192.168.81.0/24
      dns: 10.160.143.74,192.19.189.10,192.19.189.20,192.19.189.30
      gateway: 192.168.81.1
      reserved_ip_ranges: 192.168.81.1-192.168.81.10
      availability_zone_names:
      - deploy-az
  - name: services-network
    subnets:
    - iaas_identifier: karti-services
      cidr: 192.168.82.0/24
      dns: 10.160.143.74,192.19.189.10,192.19.189.20,192.19.189.30
      gateway: 192.168.82.1
      reserved_ip_ranges: 192.168.82.1-192.168.82.10
      availability_zone_names:
      - service-az
properties-configuration:
  director_configuration:
    blobstore_type: local
    bosh_recreate_on_next_deploy: false
    bosh_recreate_persistent_disks_on_next_deploy: false
    database_type: internal
    director_worker_count: 5
    encryption:
      keys: []
      providers: []
    hm_emailer_options:
      enabled: false
    hm_pager_duty_options:
      enabled: false
    identification_tags: {}
    job_configuration_on_tmpfs: false
    keep_unreachable_vms: false
    local_blobstore_options:
      enable_signed_urls: false
    ntp_servers_string: ntp.broadcom.net
    post_deploy_enabled: false
    resurrector_enabled: false
    retry_bosh_deploys: false
    skip_director_drain: false
  dns_configuration:
    excluded_recursors: []
    handlers: []
  security_configuration:
    generate_vm_passwords: true
    opsmanager_root_ca_trusted_certs: true
  syslog_configuration:
    enabled: false
resource-configuration:
  compilation:
    instances: automatic
    instance_type:
      id: automatic
    nsx:
      security_groups: []
      lbs: []
    nsxt:
      ns_groups: []
      vif_type: null
      lb:
        server_pools: []
  director:
    instances: automatic
    persistent_disk:
      size_mb: automatic
    instance_type:
      id: automatic
    nsx:
      security_groups: []
      lbs: []
    nsxt:
      ns_groups: []
      vif_type: null
      lb:
        # server_pools: []
        server_pools: [{"name":"karti-sp","port":"80"},{"name":"karti-sp-https","port":"443"}]
vmextensions-configuration: []
vmtypes-configuration: {}
